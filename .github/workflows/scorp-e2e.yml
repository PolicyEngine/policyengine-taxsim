name: S-corp end-to-end alignment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate_scorp_alignment.py'
      - 'tests/test_scorp_e2e.py'
      - '.github/workflows/scorp-e2e.yml'
      # The S-corp classification, its compatibility reform and the pinned
      # dashboard environment are what this workflow validates.
      - 'policyengine_taxsim/core/scorp.py'
      - 'policyengine_taxsim/core/scorp_reform.py'
      - 'scripts/dashboard-refresh-requirements.txt'
permissions:
  contents: read
concurrency:
  group: scorp-e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PIP_NO_CACHE_DIR: '1'
  PYTHONUNBUFFERED: '1'
# Both jobs run on two policyengine-us releases:
# - dashboard-pin: the dashboard refresh environment exactly as pinned
#   (policyengine-us 2.6.17), which predates the EITC investment-income fix
#   (pe-us#9572, first released in 2.10.1) and so gets the emulator's backport.
# - latest: the newest release, where the native formula runs unchanged.
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two year jobs at a time for each policyengine-us release.
      max-parallel: 4
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
        policyengine-us: [dashboard-pin, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt
      - if: matrix.policyengine-us == 'latest'
        run: pip install -U 'policyengine-us>=2.10.1'
      - run: pip install --no-deps -e .
      - name: Check the policyengine-us release under test
        run: |
          installed=$(python -c "from importlib.metadata import version; print(version('policyengine-us'))")
          echo "policyengine-us $installed"
          if [ "${{ matrix.policyengine-us }}" = dashboard-pin ]; then
            grep -qxF "policyengine-us==$installed" scripts/dashboard-refresh-requirements.txt
          fi
      - run: python scripts/validate_scorp_alignment.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorp-alignment-${{ matrix.year }}-${{ matrix.policyengine-us }}
          path: validation/*.json*
          retention-days: 7
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        policyengine-us: [dashboard-pin, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt
      - if: matrix.policyengine-us == 'latest'
        run: pip install -U 'policyengine-us>=2.10.1'
      - run: pip install --no-deps -e . && pip install pytest modal fastapi httpx
      - name: Check the policyengine-us release under test
        run: |
          installed=$(python -c "from importlib.metadata import version; print(version('policyengine-us'))")
          echo "policyengine-us $installed"
          if [ "${{ matrix.policyengine-us }}" = dashboard-pin ]; then
            grep -qxF "policyengine-us==$installed" scripts/dashboard-refresh-requirements.txt
          fi
      - run: SCORP_E2E=1 pytest tests/test_scorp_e2e.py -v
