name: S-corp end-to-end alignment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate_scorp_alignment.py'
      - 'tests/test_scorp_e2e.py'
      - '.github/workflows/scorp-e2e.yml'
permissions:
  contents: read
concurrency:
  group: scorp-e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PIP_NO_CACHE_DIR: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt && pip install --no-deps -e .
      - run: python scripts/validate_scorp_alignment.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorp-alignment-${{ matrix.year }}
          path: validation/*.json*
          retention-days: 7
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt && pip install --no-deps -e . && pip install pytest modal fastapi httpx
      - run: SCORP_E2E=1 pytest tests/test_scorp_e2e.py -v
