name: S-corp diagnostic probes
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PIP_NO_CACHE_DIR: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt && pip install --no-deps -e .
      - run: python scripts/audit_scorp_probes.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorp-probes-${{ matrix.year }}
          path: validation/*.json
          retention-days: 7
