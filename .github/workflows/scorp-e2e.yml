name: S-corp end-to-end alignment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate_scorp_alignment.py'
      - 'tests/test_scorp_e2e.py'
      - '.github/workflows/scorp-e2e.yml'
      # The S-corp classification and its compatibility reform, the refresh
      # code the alignment reuses, and the pinned dashboard environment.
      - 'policyengine_taxsim/core/scorp.py'
      - 'policyengine_taxsim/core/scorp_reform.py'
      - 'scripts/refresh_dashboard.py'
      - 'scripts/check_pinned_environment.py'
      - 'scripts/dashboard-refresh-requirements.txt'
      # Which PE variable each compared TAXSIM column reads.
      - 'policyengine_taxsim/config/variable_mappings.yaml'
permissions:
  contents: read
concurrency:
  group: scorp-e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PIP_NO_CACHE_DIR: '1'
  PYTHONUNBUFFERED: '1'
# Both jobs run on two policyengine-us releases:
# - dashboard-pin: the locked dashboard refresh environment (policyengine-us
#   2.6.17), checked package by package after any test-only installs. It
#   predates the EITC investment-income fix (pe-us#9572, first released in
#   2.10.1), so it gets the emulator's backport.
# - latest: the newest release, where the native formula runs unchanged.
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Ten jobs, five years on each release; at most four run at a time.
      max-parallel: 4
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
        policyengine-us: [dashboard-pin, latest]
        # Worker RSS limit. The pin keeps the dashboard refresh's 5 GiB. The
        # first 500 households of 2021 peaked at 4,280 MiB on policyengine-us
        # 2.17.0 and exceeded 5 GiB on 2.39.1 (5,599 MiB on 2.40.1, measured
        # on macOS). Hosted Linux runners have 16 GB.
        include:
          - policyengine-us: dashboard-pin
            max-memory-gb: 5
          - policyengine-us: latest
            max-memory-gb: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt
      - if: matrix.policyengine-us == 'latest'
        run: pip install -U 'policyengine-us>=2.10.1'
      - run: pip install --no-deps -e .
      # The per-package pin check runs first, so its list of moved packages is
      # reported even when pip check then fails.
      - if: matrix.policyengine-us == 'dashboard-pin'
        run: python scripts/check_pinned_environment.py scripts/dashboard-refresh-requirements.txt
      - name: Check the installed environment
        if: ${{ !cancelled() }}
        run: |
          python -c "from importlib.metadata import version as v; print('policyengine-us', v('policyengine-us'), 'policyengine-core', v('policyengine-core'))"
          pip check
      - run: python scripts/validate_scorp_alignment.py --year ${{ matrix.year }} --max-memory-gb ${{ matrix.max-memory-gb }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorp-alignment-${{ matrix.year }}-${{ matrix.policyengine-us }}
          path: validation/*.json*
          retention-days: 7
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        policyengine-us: [dashboard-pin, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/dashboard-refresh-requirements.txt
      - if: matrix.policyengine-us == 'latest'
        run: pip install -U 'policyengine-us>=2.10.1'
      - run: pip install --no-deps -e .
      # On the pin, test-only packages must fit the locked versions.
      - if: matrix.policyengine-us == 'dashboard-pin'
        run: pip install -c scripts/dashboard-refresh-requirements.txt pytest modal fastapi httpx
      - if: matrix.policyengine-us == 'latest'
        run: pip install pytest modal fastapi httpx
      # The per-package pin check runs first, so its list of moved packages is
      # reported even when pip check then fails.
      - if: matrix.policyengine-us == 'dashboard-pin'
        run: python scripts/check_pinned_environment.py scripts/dashboard-refresh-requirements.txt
      - name: Check the installed environment
        if: ${{ !cancelled() }}
        run: |
          python -c "from importlib.metadata import version as v; print('policyengine-us', v('policyengine-us'), 'policyengine-core', v('policyengine-core'))"
          pip check
      - run: SCORP_E2E=1 pytest tests/test_scorp_e2e.py -v
