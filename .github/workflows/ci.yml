name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting its six-OS test matrix (macOS jobs take
# up to 85 minutes, and the org can run only 5 macOS jobs at once) finish on a
# stale commit. Pushes to main get their own group per run and are never
# cancelled, because they version and publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The versioning job below commits "Update package version" to main with an
  # app token, which triggers this workflow again. That commit changes only
  # the version, changelog and fragments, so skip the checks on it (as
  # policyengine.py's push workflow does) instead of re-running the full
  # six-OS matrix. versioning and publish need lint and test, so they skip too;
  # on that commit they found no fragments and re-published nothing anyway.
  lint:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install ruff
        run: pip install ruff>=0.9.0
      - name: Check formatting
        run: ruff format --check .

  scorp-validation:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest tests/test_scorp_treatment.py -v

  test:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ${{ matrix.os }}
    # Slowest observed 2026-10-06..08: 85 minutes (macos-latest, Python 3.11).
    # Fail a hung job instead of holding a runner for the 6-hour default.
    timeout-minutes: 150
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis
      - name: Make TAXSIM executables executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x resources/taxsim35/taxsim35-*.exe
      - name: Run tests
        run: pytest tests/

  dashboard-test:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
      - name: Run dashboard tests
        run: bun run test

  r-package:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # The environment setup_policyengine() creates, with this checkout's
      # policyengine-taxsim, where reticulate looks for it.
      - name: Create the policyengine-taxsim virtual environment
        run: |
          python -m venv ~/.virtualenvs/policyengine-taxsim
          ~/.virtualenvs/policyengine-taxsim/bin/pip install -e .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package/policyenginetaxsim
      - name: Run R package tests
        working-directory: r-package/policyenginetaxsim
        env:
          POLICYENGINETAXSIM_REQUIRE_PYTHON: 'true'
        run: Rscript -e 'testthat::test_local(".", stop_on_failure = TRUE)'

  check-changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for changelog fragments
        run: |
          FRAGMENTS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD -- 'changelog.d/*' | grep -v '.gitkeep' || true)

          if [ -z "$FRAGMENTS" ]; then
            echo "Error: No new changelog fragments found in this PR."
            echo ""
            echo "Please add a changelog fragment. Example:"
            echo "  echo 'Description of change.' > changelog.d/$(echo $GITHUB_HEAD_REF | tr '/' '-').added.md"
            echo ""
            echo "Fragment types: added, changed, fixed, removed, breaking"
            echo "Format: changelog.d/<name>.<type>.md"
            exit 1
          fi

          echo "Found new changelog fragments:"
          echo "$FRAGMENTS"

          for f in $FRAGMENTS; do
            TYPE=$(echo "$f" | rev | cut -d. -f2 | rev)
            case "$TYPE" in
              added|changed|fixed|removed|breaking)
                echo "  OK: $f ($TYPE)"
                ;;
              *)
                echo "  ERROR: $f has invalid type '$TYPE'"
                echo "  Valid types: added, changed, fixed, removed, breaking"
                exit 1
                ;;
            esac
          done

  versioning:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check for changelog fragments
        id: fragments
        run: |
          FRAGMENTS=$(find changelog.d -type f ! -name '.gitkeep' 2>/dev/null | head -1)
          if [ -z "$FRAGMENTS" ]; then
            echo "No changelog fragments found, skipping versioning."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.fragments.outputs.found == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install towncrier
        if: steps.fragments.outputs.found == 'true'
        run: pip install towncrier

      - name: Infer version bump and update version
        if: steps.fragments.outputs.found == 'true'
        run: python .github/bump_version.py

      - name: Get new version
        if: steps.fragments.outputs.found == 'true'
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build changelog
        if: steps.fragments.outputs.found == 'true'
        run: towncrier build --yes --version ${{ steps.version.outputs.version }}

      - name: Commit version bump
        if: steps.fragments.outputs.found == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          add: "."
          message: Update package version

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [versioning]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI }}
          skip-existing: true
