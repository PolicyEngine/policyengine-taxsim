name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      data_run_id:
        description: Optional completed refresh run to verify GA/MD against the prior baseline
        type: string
        default: ''
      validate_only:
        description: Build the dashboard without publishing GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify fallback results against previous complete run
        if: inputs.data_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RUN: ${{ inputs.data_run_id }}
        run: python3 scripts/verify_fallback_results.py "$DATA_RUN"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./dashboard
        run: bun install --frozen-lockfile

      - name: Build application
        working-directory: ./dashboard
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dashboard/out

  deploy:
    if: ${{ !inputs.validate_only }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
