name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  mo-probe-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run each 2022 MO record alone
        run: |
          f=probe/census/2022-MO-000.csv
          head -1 $f > /tmp/h.csv
          tail -n +2 $f | while IFS= read -r line; do
            { cat /tmp/h.csv; echo "$line"; } > /tmp/one.csv
            rc=0; ./resources/taxsimtest/taxsimtest-windows.exe < /tmp/one.csv > /tmp/o.txt 2> /tmp/e.txt || rc=$?
            if [ $rc -ne 0 ]; then echo "FAIL rc=$rc $line"; head -c 600 /tmp/e.txt; echo; fi
          done
          echo DONE
