name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the 2020 rows on three Linux builds
        run: |
          set +e
          chmod +x probe/*.exe resources/taxsimtest/taxsimtest-linux.exe
          for X in probe/aug-linux.exe probe/nov1-linux.exe resources/taxsimtest/taxsimtest-linux.exe; do
            echo "=== $X $(strings $X | grep -o 'cd20[0-9]\{8\}' | head -1)"
            $X < probe/rows2020.csv > /tmp/o.txt 2> /tmp/e.txt; echo "rc=$?"
            grep -E "at /homes|in [a-z]+tax" /tmp/e.txt | head -4
          done
          echo PROBE_DONE
