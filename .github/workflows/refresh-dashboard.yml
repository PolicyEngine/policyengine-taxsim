name: Refresh dashboard data

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Run a 100-household smoke test without generating full data
        type: boolean
        default: false
      maryland_fallback:
        description: Use the pinned previous Linux TAXSIM binary for MD in 2024–2025
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed run to restore checkpoints from (same code and settings)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-refresh-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PIP_NO_CACHE_DIR: '1'

jobs:
  maryland-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare pinned Maryland fallback
        if: inputs.maryland_fallback
        run: |
          git fetch --depth=1 origin 2b69146bfb2e16f83e1c021d72c4258d67872190
          git show 2b69146bfb2e16f83e1c021d72c4258d67872190:resources/taxsimtest/taxsimtest-linux.exe > /tmp/taxsim-md-previous
          echo '00a321d2467ba011992f8b83c6e485a9b710c48fca4262a23fec1de26942a89b  /tmp/taxsim-md-previous' | sha256sum -c -
          chmod +x /tmp/taxsim-md-previous
          echo 'TAXSIM_MD_FALLBACK_BINARY=/tmp/taxsim-md-previous' >> "$GITHUB_ENV"
      - name: Isolate crash and validate previous Maryland binary
        if: inputs.maryland_fallback
        run: |
          ulimit -c 0
          python scripts/diagnose_maryland_taxsim.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.maryland_fallback
        with:
          name: maryland-diagnostic
          path: maryland-diagnostic
          retention-days: 7
  smoke:
    needs: maryland-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare pinned Maryland fallback
        if: inputs.maryland_fallback
        run: |
          git fetch --depth=1 origin 2b69146bfb2e16f83e1c021d72c4258d67872190
          git show 2b69146bfb2e16f83e1c021d72c4258d67872190:resources/taxsimtest/taxsimtest-linux.exe > /tmp/taxsim-md-previous
          echo '00a321d2467ba011992f8b83c6e485a9b710c48fca4262a23fec1de26942a89b  /tmp/taxsim-md-previous' | sha256sum -c -
          chmod +x /tmp/taxsim-md-previous
          echo 'TAXSIM_MD_FALLBACK_BINARY=/tmp/taxsim-md-previous' >> "$GITHUB_ENV"
      - name: Install locked refresh environment
        run: |
          pip install -r scripts/dashboard-refresh-requirements.txt
          pip install --no-deps -e .
          pip check
      - name: Check refresh safety and aggregation tests
        run: python -m unittest discover -s tests -p test_dashboard_refresh.py -v
      - name: Smoke test latest model and emulator
        run: python scripts/refresh_dashboard.py --year 2023 --limit 100 --work-dir smoke
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-smoke
          path: smoke/output
          retention-days: 7
          overwrite: true

  refresh:
    needs: smoke
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare pinned Maryland fallback
        if: inputs.maryland_fallback
        run: |
          git fetch --depth=1 origin 2b69146bfb2e16f83e1c021d72c4258d67872190
          git show 2b69146bfb2e16f83e1c021d72c4258d67872190:resources/taxsimtest/taxsimtest-linux.exe > /tmp/taxsim-md-previous
          echo '00a321d2467ba011992f8b83c6e485a9b710c48fca4262a23fec1de26942a89b  /tmp/taxsim-md-previous' | sha256sum -c -
          chmod +x /tmp/taxsim-md-previous
          echo 'TAXSIM_MD_FALLBACK_BINARY=/tmp/taxsim-md-previous' >> "$GITHUB_ENV"
      - name: Install locked refresh environment
        run: |
          pip install -r scripts/dashboard-refresh-requirements.txt
          pip install --no-deps -e .
          pip check
      - name: Restore requested checkpoints
        if: (inputs.resume_run_id != '' || github.run_attempt > 1)
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id || github.run_id }}
          YEAR: ${{ matrix.year }}
        run: |
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts" --paginate --jq '.artifacts[].name')
          if printf '%s\n' "$NAMES" | grep -Fxq "checkpoint-$YEAR"; then
            gh run download "$RESUME_RUN" --name "checkpoint-$YEAR" --dir work
          fi
      - name: Regenerate one year in isolated batches
        env:
          YEAR: ${{ matrix.year }}
        run: |
          ulimit -c 0
          python scripts/refresh_dashboard.py --year "$YEAR" --batch-size 5000 --max-memory-gb 5 --min-disk-gb 4 --work-dir work
      - name: Retain checkpoints if the job fails
        if: always() && !success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ matrix.year }}
          path: |
            work/checkpoint.json
            work/part-*.csv.gz
            work/part-*.csv.json
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: full-data-${{ matrix.year }}
          path: |
            work/output/comparison_results_*.csv
            work/output/provenance_*.json
          compression-level: 6
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: site-data-${{ matrix.year }}
          path: work/output/site
          retention-days: 7
          overwrite: true

  stage-release:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download completed full data
        uses: actions/download-artifact@v4
        with:
          pattern: full-data-*
          merge-multiple: true
          path: release-data
      - name: Stage a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="full-ecps-comparison-run-$GITHUB_RUN_ID"
          printf 'Full eCPS comparison, 111,347 households per year, 2021–2025. Generated on GitHub Actions in memory-bounded, isolated batches. Household inputs from cps_households.csv (the July 7 release inputs, with Alabama coded 1 instead of 0); --assume-w2-wages, native SALT. Model versions, source hashes, output hashes and resource measurements are included in each provenance JSON. Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.txt
          if [ "${{ inputs.maryland_fallback }}" = "true" ]; then
            printf '\nMaryland 2024–2025 uses the previous TAXSIM Linux binary (SHA256 00a321d2467ba011992f8b83c6e485a9b710c48fca4262a23fec1de26942a89b) because the September build crashes in mdtax22. All other state/year results use the September binary. Complete Maryland TAXSIM outputs, including federal outputs, come from the previous build. Per-record binary hashes and provenance identify the exception.\n' >> release-notes.txt
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Full eCPS comparison $(date -u +%Y-%m-%d)" --notes-file release-notes.txt release-data/*
          echo "Draft release: $TAG" >> "$GITHUB_STEP_SUMMARY"
