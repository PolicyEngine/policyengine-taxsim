name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the 1496 record 1000 times
        run: |
          X=./resources/taxsimtest/taxsimtest-linux.exe
          chmod +x $X
          strings $X | grep -o 'cd20[0-9]\{8\}' | head -1
          ok=0; bad=0
          for i in $(seq 1 1000); do
            if $X < probe/r1496.csv > /tmp/o.txt 2> /tmp/e.txt; then ok=$((ok+1)); else bad=$((bad+1)); [ $bad -le 2 ] && head -c 400 /tmp/e.txt; fi
          done
          echo "RESULT ok=$ok bad=$bad"
          $X < probe/r1496.csv | grep -E '^[0-9]' | cut -d, -f1-5
