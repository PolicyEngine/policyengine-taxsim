name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  fpe-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native runs per variant
        run: |
          chmod +x resources/taxsimtest/taxsimtest-linux.exe
          for f in ny2025 ny2025opt30 ny2024 ny2023 ny2022 ca2025; do
            fail=0
            for i in $(seq 1 500); do
              ./resources/taxsimtest/taxsimtest-linux.exe < probe/fpe/$f.csv > /tmp/o.txt 2> /tmp/e.txt || { fail=$((fail+1)); [ $fail -le 1 ] && command grep -E "in [a-z0-9_]+_|taxsim.f" /tmp/e.txt | head -6; }
            done
            echo "RESULT $f failures: $fail of 500"
          done
          ./resources/taxsimtest/taxsimtest-linux.exe < probe/fpe/ny2025.csv || true
