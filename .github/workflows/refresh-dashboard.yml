name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repeat the Virginia rows and the Georgia rows
        run: |
          set +e
          X=resources/taxsimtest/taxsimtest-linux.exe
          chmod +x $X
          f=probe/rows2020.csv
          head -1 $f > /tmp/h.csv
          N=$(($(wc -l < $f) - 1)); k=0
          for j in $(seq 1 $N); do head -$((j+1)) $f | $X > /dev/null 2>&1 || { k=$j; break; }; done
          echo "first failing prefix $k"
          crow=$(sed -n "$((k+1))p" $f); echo "CRASH ROW $crow"
          for i in $(seq 1 $((k-1))); do
            prow=$(sed -n "$((i+1))p" $f)
            n=0; for r in 1 2 3 4 5; do { cat /tmp/h.csv; echo "$prow"; echo "$crow"; } | $X > /dev/null 2>&1 || n=$((n+1)); done
            [ $n -gt 0 ] && echo "PAIR $n/5 | $prow"
          done
          echo PROBE_DONE
