name: Refresh dashboard data

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: TAXSIM input population (populace is the benchmark; ecps is the archived Enhanced CPS)
        type: choice
        options: [populace, ecps]
        default: populace
      smoke_only:
        description: Run a 100-household smoke test without generating full data
        type: boolean
        default: false
      resume_run_id:
        description: Optional failed run to restore checkpoints from (same code and settings)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-refresh-${{ github.ref }}-${{ inputs.dataset }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PIP_NO_CACHE_DIR: '1'
  DATASET: ${{ inputs.dataset }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked refresh environment
        run: |
          pip install -r scripts/dashboard-refresh-requirements.txt
          pip install --no-deps -e .
          pip check
      - name: Check refresh safety and aggregation tests
        run: python -m unittest discover -s tests -p test_dashboard_refresh.py -v
      - name: Smoke test latest model and emulator
        run: python scripts/refresh_dashboard.py --dataset "$DATASET" --year 2023 --limit 100 --work-dir smoke
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-smoke-${{ inputs.dataset }}
          path: smoke/output
          retention-days: 7
          overwrite: true

  refresh:
    needs: smoke
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked refresh environment
        run: |
          pip install -r scripts/dashboard-refresh-requirements.txt
          pip install --no-deps -e .
          pip check
      - name: Restore requested checkpoints
        if: (inputs.resume_run_id != '' || github.run_attempt > 1)
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id || github.run_id }}
          YEAR: ${{ matrix.year }}
        run: |
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts" --paginate --jq '.artifacts[].name')
          if printf '%s\n' "$NAMES" | grep -Fxq "checkpoint-$DATASET-$YEAR"; then
            gh run download "$RESUME_RUN" --name "checkpoint-$DATASET-$YEAR" --dir work
          fi
      - name: Regenerate one year in isolated batches
        env:
          YEAR: ${{ matrix.year }}
        run: python scripts/refresh_dashboard.py --dataset "$DATASET" --year "$YEAR" --batch-size 5000 --max-memory-gb 5 --min-disk-gb 4 --work-dir work
      - name: Retain checkpoints if the job fails
        if: always() && !success()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ inputs.dataset }}-${{ matrix.year }}
          path: |
            work/checkpoint.json
            work/part-*.csv.gz
            work/part-*.csv.json
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: full-data-${{ inputs.dataset }}-${{ matrix.year }}
          path: |
            work/output/comparison_results_*.csv
            work/output/provenance_*.json
          compression-level: 6
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: site-data-${{ inputs.dataset }}-${{ matrix.year }}
          path: work/output/site
          retention-days: 7
          overwrite: true

  stage-release:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download completed full data
        uses: actions/download-artifact@v4
        with:
          pattern: full-data-${{ inputs.dataset }}-*
          merge-multiple: true
          path: release-data
      - name: Stage a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$DATASET-comparison-run-$GITHUB_RUN_ID"
          python3 scripts/refresh_dashboard.py --release-notes release-data \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > release-notes.md
          TITLE=$(python3 scripts/refresh_dashboard.py --release-title release-data)
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md release-data/*
          echo "Draft release: $TAG" >> "$GITHUB_STEP_SUMMARY"
