name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the census 3 times and the issue probes
        run: |
          set +e
          X=./resources/taxsimtest/taxsimtest-linux.exe
          chmod +x $X
          strings $X | grep -o 'cd20[0-9]\{8\}' | head -1
          for r in 1 2 3; do
            mkdir -p out$r
            for f in probe/census/*.csv; do $X < $f > out$r/$(basename $f) 2>/dev/null || echo "CRASH run $r $f"; done
          done
          for f in out1/*.csv; do
            b=$(basename $f)
            cmp -s $f out2/$b && cmp -s $f out3/$b || echo "UNSTABLE $b"
          done
          echo CENSUS_DONE
          mkdir -p out1/dan1112
          for f in probe/dan1112/*.csv; do
            n=0; for r in 1 2 3 4 5; do $X < $f > out1/dan1112/$(basename $f) 2>/dev/null || n=$((n+1)); done
            echo "PROBE $f fails $n/5"
          done
          echo PROBES_DONE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-linux-cd2026111817
          path: out1
