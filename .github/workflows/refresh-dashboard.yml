name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the census 3 times and the CO probe 12 times
        run: |
          X=./resources/taxsimtest/taxsimtest-linux.exe
          chmod +x $X
          strings $X | grep -o 'cd20[0-9]\{8\}' | head -1
          for r in 1 2 3; do
            mkdir -p out$r
            for f in probe/census/*.csv; do $X < $f > out$r/$(basename $f); done
          done
          for f in out1/*.csv; do
            b=$(basename $f)
            cmp -s $f out2/$b && cmp -s $f out3/$b || echo "UNSTABLE $b"
          done
          echo CENSUS_DONE
          for i in $(seq 1 12); do $X < probe/co1473.csv | grep -E '^[0-9]' | awk -F, '{printf "%s ", $37} END {print ""}'; done | sort | uniq -c
          echo CO_DONE
      - uses: actions/upload-artifact@v4
        with:
          name: census-linux-cd2026110517
          path: out1
