name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  census-probe-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run the census batches twice
        run: |
          for run in 1 2; do mkdir -p out/run$run; for f in probe/census/*.csv; do ./resources/taxsimtest/taxsimtest-windows.exe < "$f" > "out/run$run/$(basename "$f" .csv).taxsim.csv" || echo "FAILED run$run $f"; done; done
          for f in out/run1/*.taxsim.csv; do b=$(basename "$f"); cmp -s "$f" "out/run2/$b" || echo "UNSTABLE $b"; done
      - uses: actions/upload-artifact@v4
        with: {name: census-windows-cd2026110117, path: out/run1}
