name: Refresh dashboard data

on:
  workflow_dispatch:

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run each 2020 row alone, 3 times, on two builds
        run: |
          set +e
          chmod +x probe/*.exe resources/taxsimtest/taxsimtest-linux.exe
          f=probe/rows2020.csv
          head -1 $f > /tmp/h.csv
          for X in probe/nov8-linux.exe resources/taxsimtest/taxsimtest-linux.exe; do
            echo "=== $X $(strings $X | grep -o 'cd20[0-9]\{8\}' | head -1)"
            $X < $f > /dev/null 2>&1; echo "whole file rc=$?"
            tail -n +2 $f | while IFS= read -r line; do
              n=0; fn=""
              for r in 1 2 3; do
                { cat /tmp/h.csv; echo "$line"; } | $X > /dev/null 2> /tmp/e.txt
                if [ $? -ne 0 ]; then n=$((n+1)); fn=$(grep -o '[a-z0-9]*_ *$\|in [a-z0-9_]*' /tmp/e.txt | sed -n 1p); fl=$(grep -o 'taxsim.f:[0-9]*' /tmp/e.txt | head -1); fi
              done
              [ $n -gt 0 ] && echo "FAIL $n/3 $fn $fl | $line"
            done
          done
          echo PROBE_DONE
