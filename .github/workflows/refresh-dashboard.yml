# Probe only (scratch branch, not for merging): run the Iowa rows of taxsim
# #1358/#1108/#1111 through the October 24 Linux TAXSIM build eight times.
name: Refresh dashboard data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ia-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Iowa rows eight times
        run: |
          chmod +x resources/taxsimtest/taxsimtest-linux.exe
          strings resources/taxsimtest/taxsimtest-linux.exe | grep -oE 'cd20[0-9]{8}' | head -1
          for i in 1 2 3 4 5 6 7 8; do
            echo "== run $i"
            ./resources/taxsimtest/taxsimtest-linux.exe < probe/ia_1358.csv
            ./resources/taxsimtest/taxsimtest-linux.exe < probe/ia_1111.csv
          done
